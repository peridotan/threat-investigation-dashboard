name: Refresh ATT&CK data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 09:15 JST. ATT&CK is not a daily feed; weekly refresh is sufficient for this dashboard.
    - cron: "15 0 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Refresh MITRE ATT&CK Enterprise dataset
        run: python scripts/update_attack.py

      - name: Validate generated dataset
        run: python scripts/validate_data.py

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html legal.html app.js environment.js style.css font-size.css font-size.js .nojekyll _site/
          cp data/dashboard.json _site/data/
          cp LICENSE COPYRIGHT.md THIRD_PARTY_NOTICES.md DISCLAIMER.md README.md MY_ENVIRONMENT_SCHEMA.md _site/
          cp data/README.md _site/data/README.md

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
